<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VU Žemėlapis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f7f9fc;
      text-align: center;
    }
    .map-link {
      display: inline-block;
      padding: 15px 25px;
      background-color: #005baa;
      color: white;
      text-decoration: none;
      font-size: 18px;
      border-radius: 8px;
      transition: background-color 0.3s;
    }
    .map-link:hover {
      background-color: #003d7a;
    }
    .description {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Vilniaus universiteto žemėlapio peržiūra</h1>
  <p class="description">
    Paspauskite mygtuką žemiau, kad atidarytumėte žemėlapio aplikaciją ArcGIS platformoje.
  </p>
  <a class="map-link"
     href="https://vu-lt.maps.arcgis.com/apps/instant/reporter/index.html?appid=ff6b09a274c7488993335ea2a45b4cb0"
     target="_blank"
     rel="noopener noreferrer">
    Atidaryti žemėlapį
  </a>
</body>
</html>
